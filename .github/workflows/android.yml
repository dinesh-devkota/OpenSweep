name: Android build

on:
  push:
    branches: ['**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', '.github/workflows/release.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'

      - name: Test, lint and build
        env:
          RAW_VERSION: ${{ inputs.release_version }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version"
            exit 1
          fi
          bash gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease \
            "-PreleaseVersion=${version:-dev}" "-PreleaseCode=$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/debug/app-debug.apk OpenSweep-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify OpenSweep-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: OpenSweep-Android-debug
          path: android/OpenSweep-debug.apk
          if-no-files-found: error

      - name: Pass the release build to signing
        if: inputs.release_version != ''
        uses: actions/upload-artifact@v7
        with:
          name: OpenSweep-Android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Pass APKs to device checks
        uses: actions/upload-artifact@v7
        with:
          name: OpenSweep-Android-device-tests
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  device-checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: OpenSweep-Android-device-tests
          path: android/app/build/outputs/apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify previews, protection, trash and restore across process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel
          working-directory: android
          script: bash test-device.sh
      - name: Save device-check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenSweep-device-results-API-${{ matrix.api }}
          path: android/build/device-reports
          if-no-files-found: warn
