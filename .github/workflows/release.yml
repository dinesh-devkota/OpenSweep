name: Build, sign and release

# Push a tag like v1.1.0, or run manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.0'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  android:
    # A manual release can only sign and publish from the default branch.
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
    with:
      release_version: ${{ inputs.version || github.ref_name }}

  sign-android:
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SqueakySift-Android-unsigned

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}" "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${STORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}" "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/android-signing.XXXXXX")"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out SqueakySift.apk app-release-unsigned.apk
          signatures="$("$signer" verify --verbose --print-certs SqueakySift.apk)"
          printf '%s\n' "$signatures"
          # Keep updates compatible with the first official release. Forks use their own keys.
          if [[ "$GITHUB_REPOSITORY_ID" == 1437677562 ]]; then
            expected=fc792f282be754e0935e89c065c13b32b802667b8ab375cdfc07508afd5d9f78
            grep -Fxq "Number of signers: 1" <<< "$signatures"
            grep -Fxq "Signer #1 certificate SHA-256 digest: $expected" <<< "$signatures"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: SqueakySift-Android-release
          path: SqueakySift.apk
          if-no-files-found: error

  release:
    needs: sign-android
    runs-on: windows-latest
    env:
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build portable exe
        shell: pwsh
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $v = $env:RAW_VERSION.TrimStart('v')
          "VERSION=$v" >> $env:GITHUB_ENV
          ./build.ps1 -Version $v -NoInstaller

      - name: Upload unsigned exe
        id: unsigned_exe
        uses: actions/upload-artifact@v7
        with:
          name: SqueakySift-unsigned
          path: dist/SqueakySift.exe

      # Signing steps run once the SignPath variables and secret are configured (see SIGNING.md).
      - name: Sign SqueakySift.exe
        if: ${{ env.SIGNING == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'OpenSweep' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned_exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Use signed exe
        if: ${{ env.SIGNING == 'true' }}
        shell: pwsh
        run: |
          Copy-Item signed-exe/SqueakySift.exe dist/SqueakySift.exe -Force
          $sig = Get-AuthenticodeSignature dist/SqueakySift.exe
          if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status)" }
          "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer/OpenSweep.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Upload unsigned installer
        id: unsigned_setup
        uses: actions/upload-artifact@v7
        with:
          name: SqueakySift-Setup-unsigned
          path: dist/SqueakySift-Setup.exe

      - name: Sign SqueakySift-Setup.exe
        if: ${{ env.SIGNING == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'OpenSweep' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned_setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Use signed installer
        if: ${{ env.SIGNING == 'true' }}
        shell: pwsh
        run: |
          Copy-Item signed-setup/SqueakySift-Setup.exe dist/SqueakySift-Setup.exe -Force
          $sig = Get-AuthenticodeSignature dist/SqueakySift-Setup.exe
          if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status)" }

      - name: Collect signed Android APK
        uses: actions/download-artifact@v8
        with:
          name: SqueakySift-Android-release
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $repo = $env:GITHUB_REPOSITORY
          $downloads = "https://github.com/$repo/releases/download/$tag"
          $files = foreach ($suffix in '-Setup.exe', '.exe', '.apk') {
            $current = "dist/SqueakySift$suffix"
            $legacy = "dist/OpenSweep$suffix"
            Copy-Item -LiteralPath $current -Destination $legacy -Force
            $current
            $legacy
          }
          $hashes = $files | ForEach-Object { "SHA-256 ($(Split-Path $_ -Leaf)): ``$((Get-FileHash $_ -Algorithm SHA256).Hash)``" }
          $signed = if ($env:SIGNING -eq 'true') { 'The Windows downloads are digitally signed (free code signing by SignPath.io, certificate by SignPath Foundation).' } else { 'The Windows downloads are unsigned.' }
          $changelogPath = "docs/releases/$env:VERSION.md"
          $changelog = if (Test-Path $changelogPath) { Get-Content $changelogPath -Raw }
          $notes = @(
            "**[Download SqueakySift-Setup.exe]($downloads/SqueakySift-Setup.exe)** to install on Windows.",
            '',
            "**[Download SqueakySift.exe]($downloads/SqueakySift.exe)** to run the portable Windows app.",
            '',
            "**[Download SqueakySift.apk]($downloads/SqueakySift.apk)** to install on Android 8.0 or newer.",
            '',
            'The OpenSweep filenames contain the same downloads for existing links.',
            '',
            $signed,
            '',
            $changelog,
            '',
            "SqueakySift is free. If it helps you, please consider a **[donation via PayPal](https://www.paypal.biz/alinafunddevkota)**.",
            ''
          ) + $hashes + @('', "See the [code signing policy](https://github.com/$repo/blob/$tag/SIGNING.md).") -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $publishedCommit = gh api "repos/$repo/commits/$tag" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $publishedCommit -ne $env:GITHUB_SHA) {
              throw "The existing release tag points to a different commit."
            }
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
            gh release edit $tag --title "SqueakySift $env:VERSION" --notes-file $notesFile
          } else {
            gh release create $tag @files --title "SqueakySift $env:VERSION" --notes-file $notesFile --target $env:GITHUB_SHA --latest
          }
          exit $LASTEXITCODE
