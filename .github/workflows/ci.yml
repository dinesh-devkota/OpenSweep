name: Build and regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Run managed regression checks
        run: dotnet run --project tests/OpenSweep.RegressionTests/OpenSweep.RegressionTests.csproj -c Release
      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -NoInstaller
      - name: Render update and history pages and verify Windows signatures
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/Windows.Smoke.ps1
      - name: Upload Windows preview application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: OpenSweep-windows-preview
          path: dist/OpenSweep.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows UI smoke captures
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke
          path: artifacts/windows-smoke/*.png
          if-no-files-found: ignore
