title: SqueakySift – Free Cleaner for Windows and Android
description: SqueakySift is a free cleaner for Windows and Android. Scan shared Android storage, review junk and large files, remove extra duplicate copies, manage app caches with optional Shizuku access and uninstall apps. On Windows, clean files, review startup and update software.
url: https://dinesh-devkota.github.io
baseurl: /SqueakySift
lang: en
author: dinesh-devkota
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - android
  - src
  - tools
  - build.ps1
  - dist
